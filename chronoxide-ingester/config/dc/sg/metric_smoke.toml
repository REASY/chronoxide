[kafka]
auto_offset_reset = "latest"
group_id = "chronoxide-ingester-smoke"
topic = "otlp_metrics"
security_protocol = "SASL_PLAINTEXT"
sasl_mechanism = "SCRAM-SHA-512"

[ingestion]
max_event_age_secs = 3600
max_event_lead_secs = 5
drop_outdated = true
internal_buffer_size = 1000000
stop_after_messages = 13000000
capture_to = "data/smoke/kafka-capture-001"
capture_only = false
labelset_report_interval_secs = 10

[ingestion.head_buffer]
enabled = true
window_duration_secs = 3600
out_of_order_time_window_secs = 3600
float_encoding = "gorilla"
int_encoding = "delta_zig_zag"
varlen_encoding = "raw"

[ingestion.segment_writer]
enabled = true
segments_dir = "data/smoke/segments-001"
segment_duration_secs = 900
deterministic_id_seed = 42
float_encoding = "gorilla"
int_encoding = "delta_zig_zag"
varlen_encoding = "raw"
