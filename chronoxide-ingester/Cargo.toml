[package]
name = "chronoxide-ingester"
authors.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
ahash = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true, features = ["default", "serde"] }
chronoxide-capture = { workspace = true }
chronoxide-core = { workspace = true }
chronoxide-api = { workspace = true }
clap = { workspace = true }
crc32c = { workspace = true }
dashmap = { workspace = true }
hyperloglog = { workspace = true }
gethostname = { workspace = true }
local-ip-address = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-proto = { workspace = true }
opentelemetry-resource-detectors = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["default", "spec_unstable_metrics_views"] }
prost = { workspace = true }
prost-types = { workspace = true }
rayon = { workspace = true }
rdkafka = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
strum_macros = { workspace = true }
tdigests = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }
tikv-jemalloc-sys = { workspace = true, optional = true }

[dev-dependencies]
chronoxide-core = { workspace = true, features = ["test-hooks"] }
criterion = { workspace = true }
rand = { workspace = true }
smallvec = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
io_uring = ["chronoxide-core/io_uring"]
jemalloc = ["dep:tikv-jemallocator"]
jemalloc-stats = [
    "jemalloc",
    "tikv-jemallocator/stats",
    "dep:tikv-jemalloc-sys",
    "tikv-jemalloc-sys/stats",
]

[[bench]]
name = "stats_u32"
harness = false
