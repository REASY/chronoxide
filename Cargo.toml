[workspace]
resolver = "3"

members = [
    "chronoxide-core",
    "chronoxide-ingester",
]

[workspace.package]
authors = ["Artavazd Balaian <reasyu@gmail.com>"]
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
rust-version = "1.93.0"
version = "0.2.0"

[workspace.dependencies]
alp = {  git = "https://github.com/spiraldb/alp.git", rev = "d9318ed7db97b6b30f650741062700c445ecde84" }
chrono = { version = "0.4" }
chronoxide-core = { path = "chronoxide-core" }
chronoxide-ingester = { path = "chronoxide-ingester" }
clap = { version = "4.5.32", features = ["derive"] }
crc32c = "0.6"
criterion = { version = "0.8", features = ["async_tokio"] }
dashmap = { version = "6.1"}
futures = { version = "0.3" }
fst = "0.4"
german-str = "1.0.0"
gethostname = "1.1.0"
hyperloglog = "1.0.3"
io-uring = "0.7"
lasso = "0.7.3"
local-ip-address = "0.6.9"
opentelemetry = "0.31.0"
opentelemetry-appender-tracing = "0.31.1"
opentelemetry-otlp = "0.31.0"
opentelemetry-proto = "0.31.0"
opentelemetry-resource-detectors = "0.10.0"
opentelemetry-semantic-conventions = "0.31.0"
opentelemetry_sdk = "0.31.0"
prost = "0.14"
prost-types = "0.14"
rand = "0.9.2"
rayon = "1.11.0"
rdkafka = { version = "0.38", features = ["ssl", "gssapi", "zstd"] }
regex = "1.12.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_ext_duration = { version = "0.2.0"}
serde_json = "1"
smallvec = "1.15.1"
smol_str = "0.3.5"
strum = "0.27"
strum_macros = "0.27"
tdigests = "1.0"
tempfile = "3.24"
test-log = "0.2"
testcontainers = { version = "0.25.2", features = ["watchdog"] }
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = { version = "0.9.11"}
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1.2"
uuid = { version = "1.20.0", features = ["default", "v4"]}
vortex-alp = "0.58.0"
vortex-array = { version = "0.58.0", default-features = false }
vortex-buffer = { version = "0.58.0", default-features = false }
vortex-dtype = { version = "0.58.0", default-features = false }
zstd = "0.13.3"

[profile.profiling]
inherits = "release"
debug = true
strip = false

[profile.release]
debug = true
