[workspace]
resolver = "3"

members = [
    "chronoxide-core"
]

[workspace.package]
authors = ["Artavazd Balaian <reasyu@gmail.com>"]
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
rust-version = "1.92.0"
version = "0.1.0"

[workspace.dependencies]
chronoxide-core = { path = "chronoxide-core" }
criterion = { version = "0.8", features = ["async_tokio"] }
german-str = "1.0.0"
lasso = "0.7.3"
rand = "0.9.2"
smol_str = "0.3.5"
thiserror = "2.0"

[profile.profiling]
inherits = "release"
debug = true
strip = false

[profile.release]
debug = true
